# Local dev stack: Postgres + all CasperVPN services.
# Dev credentials only — never reuse in prod (see rules/security.md).
# Bring up:  make up      Tear down:  make down
name: caspervpn-dev

x-service-defaults: &service-defaults
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caspervpn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-caspervpn}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caspervpn}"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    <<: *service-defaults
    build:
      context: .
      args: { SERVICE: control-plane }
    environment:
      PORT: 8081
      ENV: dev
      SEED: "true"
      # Demo fleet (mimicry domains/IPs) is data, mounted below — never baked in.
      SEED_NODES_FILE: /config/seed.nodes.json
      DATABASE_URL: postgres://${POSTGRES_USER:-caspervpn}:${POSTGRES_PASSWORD:-dev_only_change_me}@postgres:5432/${POSTGRES_DB:-caspervpn}?sslmode=disable
      # Dev-only service tokens (token:role). NEVER reuse in prod — see rules/security.md.
      CONTROL_PLANE_TOKENS: ${CONTROL_PLANE_TOKENS:-dev-admin-token:admin,dev-orchestrator-token:orchestrator,dev-telemetry-token:telemetry,dev-subscription-token:subscription,dev-billing-token:billing}
      # Token revocation propagation into the subscription service (dev-only token).
      SUBSCRIPTION_INTERNAL_URL: http://subscription:8082
      SUBSCRIPTION_INTERNAL_TOKEN: ${SUBSCRIPTION_INTERNAL_TOKEN:-dev-internal-token}
    volumes:
      - ./services/control-plane/config:/config:ro
    ports: ["8081:8081"]

  subscription:
    <<: *service-defaults
    build:
      context: .
      args: { SERVICE: subscription }
    environment:
      PORT: 8082
      DATABASE_URL: postgres://${POSTGRES_USER:-caspervpn}:${POSTGRES_PASSWORD:-dev_only_change_me}@postgres:5432/${POSTGRES_DB:-caspervpn}?sslmode=disable
      # Enables /internal/* (revoke, tokens, invalidate); must match control-plane's
      # SUBSCRIPTION_INTERNAL_TOKEN. Dev-only value.
      INTERNAL_TOKEN: ${SUBSCRIPTION_INTERNAL_TOKEN:-dev-internal-token}
      # Real control-plane provider (without these the in-memory fixtures are used).
      CONTROL_PLANE_URL: http://control-plane:8081
      CONTROL_PLANE_TOKEN: ${SUBSCRIPTION_CP_TOKEN:-dev-subscription-token}
    volumes:
      # Routing policy is data, not code (distroless image ships no files).
      - ./services/subscription/config:/config:ro
    ports: ["8082:8082"]

  delivery:
    <<: *service-defaults
    build:
      context: .
      args: { SERVICE: delivery }
    environment:
      PORT: 8083
    ports: ["8083:8083"]

  billing:
    <<: *service-defaults
    build:
      context: .
      args: { SERVICE: billing }
    environment:
      PORT: 8084
      DATABASE_URL: postgres://${POSTGRES_USER:-caspervpn}:${POSTGRES_PASSWORD:-dev_only_change_me}@postgres:5432/${POSTGRES_DB:-caspervpn}?sslmode=disable
      CONTROL_PLANE_URL: http://control-plane:8081
      CONTROL_PLANE_TOKEN: ${BILLING_CP_TOKEN:-dev-billing-token}
      # Dev-only mock gateway (HMAC-verified webhooks). NEVER set in prod.
      BILLING_MOCK_SECRET: ${BILLING_MOCK_SECRET:-dev-mock-webhook-secret}
      BILLING_PLAN_CATALOG: /config/plans.example.json
    volumes:
      - ./services/billing/config:/config:ro
    ports: ["8084:8084"]

  telemetry:
    <<: *service-defaults
    build:
      context: .
      args: { SERVICE: telemetry }
    environment:
      PORT: 8085
      DATABASE_URL: postgres://${POSTGRES_USER:-caspervpn}:${POSTGRES_PASSWORD:-dev_only_change_me}@postgres:5432/${POSTGRES_DB:-caspervpn}?sslmode=disable
      # Internal endpoints are fail-closed: without a token they return 403.
      # Dev-only value, NEVER reuse in prod.
      TELEMETRY_INTERNAL_TOKEN: ${TELEMETRY_INTERNAL_TOKEN:-dev-telemetry-internal-token}
    ports: ["8085:8085"]

  orchestrator:
    <<: *service-defaults
    build:
      context: .
      args: { SERVICE: orchestrator }
    environment:
      PORT: 8086
      DATABASE_URL: postgres://${POSTGRES_USER:-caspervpn}:${POSTGRES_PASSWORD:-dev_only_change_me}@postgres:5432/${POSTGRES_DB:-caspervpn}?sslmode=disable
    ports: ["8086:8086"]

volumes:
  pgdata:
