# Go CI for the whole workspace: build + vet + test (-race) across packages/contracts
# and every service module. Fills the gap where only subscription had a Go gate — the
# other five services (control-plane, delivery, billing, telemetry, orchestrator) were
# ungated. Subscription keeps its own workflow for the extra fuzz/sing-box checks.
name: go-ci

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "packages/**"
      - "go.work"
      - "**/go.mod"
      - "**/go.sum"
      - "Makefile"
      - ".github/workflows/go-ci.yml"
  pull_request:
    paths:
      - "services/**"
      - "packages/**"
      - "go.work"
      - "**/go.mod"
      - "**/go.sum"
      - "Makefile"
      - ".github/workflows/go-ci.yml"

permissions:
  contents: read

# One in-flight run per ref; a new push to the same PR cancels the previous run.
concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all-modules:
    name: build / vet / test (all modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          # Cache keyed on every module's go.sum (workspace has several).
          cache-dependency-path: "**/go.sum"
      - name: build
        run: make build
      - name: vet
        run: make vet
      - name: test
        run: make test

  lint:
    name: golangci-lint (all modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: "**/go.sum"
      # Pinned to the v2 line the repo config (version: "2") targets.
      - name: install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.5.0
      - name: lint
        run: make lint LINT_STRICT=1
