---
# Spin a node in a container, provision it, and assert sing-box listens and
# serves a REALITY inbound with NO own certificate. Runs in CI (no cloud).
driver:
  name: docker
platforms:
  - name: casper-node
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      # converge.yml includes roles by name (singbox, transports, …); point Ansible
      # at the repo roles dir (MOLECULE_PROJECT_DIRECTORY is infra/ansible).
      roles_path: "${MOLECULE_PROJECT_DIRECTORY}/roles"
verifier:
  name: ansible
