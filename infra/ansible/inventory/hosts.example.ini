# Example inventory. Real hosts/IPs are injected by scripts/node_up.sh from
# Terraform outputs — never commit real IPs here. Copy to hosts.ini for manual runs.

[entry]
# entry-1 ansible_host=203.0.113.10 node_id=nd_entry_1 health_region=RU-MOW

[exit]
# exit-1 ansible_host=198.51.100.20 node_id=nd_exit_1 allowed_entry_ip=203.0.113.10

[nodes:children]
entry
exit
