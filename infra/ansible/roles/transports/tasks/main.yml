---
# Build /etc/sing-box/config.json from the enabled transports, then validate it
# with `sing-box check`. Enforces the [АНТИ-БЛОК] invariants at config-build time.

- name: Merge personal REALITY short ids into the active snapshot
  when: reality_users | length > 0
  ansible.builtin.set_fact:
    transports: >-
      {{ transports | combine({'vless_reality':
         transports.vless_reality | combine({
           'short_ids': reality_users | map(attribute='short_id') | list
         })}, recursive=True) }}

- name: Validate personal multi-transport access snapshot
  when: access_snapshot_valid_until | length > 0
  ansible.builtin.assert:
    that:
      - access_snapshot_revision | length > 0
      - reality_users | length == hysteria2_users | length
      - reality_users | selectattr('uuid', 'undefined') | list | length == 0
      - reality_users | selectattr('short_id', 'undefined') | list | length == 0
      - hysteria2_users | selectattr('password', 'undefined') | list | length == 0
      - hysteria2_users | map(attribute='password') | select('equalto', '') | list | length == 0
    fail_msg: "Access snapshot must carry complete VLESS and personal Hysteria2 credentials."
  no_log: true

# --- REALITY keypair: resolve (explicit | state file | generate) before asserts,
# so private_key is populated idempotently from the persisted pair. ---
- name: Resolve REALITY keypair
  when: transports.vless_reality.enabled
  ansible.builtin.include_tasks: keygen.yml

# --- Invariant 1: at least one transport, and REALITY is properly configured ---
- name: Assert at least one transport is enabled
  ansible.builtin.assert:
    that:
      - transports.vless_reality.enabled or transports.amneziawg.enabled or transports.hysteria2.enabled or transports.shadowsocks_2022.enabled
    fail_msg: "No transport enabled — a node must never be a monoculture of zero."

- name: Assert REALITY mimicry target is supplied (no hardcode, must be provided)
  when: transports.vless_reality.enabled
  ansible.builtin.assert:
    that:
      - transports.vless_reality.server_names | length > 0
      - transports.vless_reality.handshake_server | length > 0
      - transports.vless_reality.private_key | length > 0
    fail_msg: >-
      vless-reality is enabled but server_names/handshake_server/private_key are
      empty. Mimicry target and keys MUST be provided from config/vault
      (see docs/mimicry-domains.md) — they are never hardcoded.

# --- Invariant 2: hysteria2 (UDP/443-only) REQUIRES a TCP fallback transport ---
- name: Assert hysteria2 has a TCP fallback (vless-reality) when enabled
  when: transports.hysteria2.enabled
  ansible.builtin.assert:
    that:
      - transports.vless_reality.enabled
    fail_msg: >-
      hysteria2 is UDP-only; if UDP/443 is cut clients lose it. Enable
      vless-reality (TCP/443) as the mandatory fallback before enabling hysteria2.

# --- hysteria2 password: resolve once, persist, reuse (idempotent). ---
- name: Resolve hysteria2 password
  when: transports.hysteria2.enabled
  ansible.builtin.include_tasks: hy2_keygen.yml

# --- hysteria2 QUIC TLS. FAIL-CLOSED: production requires an operator-provided
# trusted cert+key (from a secret manager). A self-signed cert is generated ONLY
# under the explicit e2e flag; production never silently falls back to insecure —
# missing material fails the converge, so the node stays provisioning. ---
- name: Assert production hysteria2 TLS material is present (fail-closed)
  when:
    - transports.hysteria2.enabled
    - not (hysteria2_insecure_e2e | bool)
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ transports.hysteria2.tls_cert_path }}"
    - "{{ transports.hysteria2.tls_key_path }}"
  register: hy2_tls_stat

- name: Fail closed when production hysteria2 TLS material is missing
  when:
    - transports.hysteria2.enabled
    - not (hysteria2_insecure_e2e | bool)
  ansible.builtin.assert:
    that:
      - hy2_tls_stat.results | map(attribute='stat.exists') | select('equalto', false) | list | length == 0
    fail_msg: >-
      hysteria2 is enabled in production but its TLS certificate/key are missing.
      Provide a TRUSTED cert+key from the secret manager (tls_cert_path /
      tls_key_path). Refusing to silently fall back to a self-signed/insecure cert
      — the node stays provisioning until real TLS material is supplied. To run the
      local e2e with a self-signed cert, set hysteria2_insecure_e2e=true.

- name: (e2e only) Generate hysteria2 self-signed cert
  when:
    - transports.hysteria2.enabled
    - hysteria2_insecure_e2e | bool
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -nodes -newkey ec
      -pkeyopt ec_paramgen_curve:prime256v1
      -keyout {{ transports.hysteria2.tls_key_path }}
      -out {{ transports.hysteria2.tls_cert_path }}
      -subj "/CN={{ transports.hysteria2.tls_sni | default('localhost', true) }}"
      -days 3650
    creates: "{{ transports.hysteria2.tls_cert_path }}"

- name: Render sing-box config.json
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ singbox_config_dir }}/config.json"
    owner: "{{ singbox_user | default('sing-box') }}"
    group: "{{ singbox_group | default('sing-box') }}"
    mode: "0640"
    validate: "{{ singbox_bin }} check -c %s"
  notify: restart sing-box

- name: Verify sing-box config (explicit check)
  ansible.builtin.command: "{{ singbox_bin }} check -c {{ singbox_config_dir }}/config.json"
  changed_when: false

- name: Install access lease watchdog
  when: access_snapshot_valid_until | length > 0
  block:
    - name: Ensure private access lease directory exists
      ansible.builtin.file:
        path: "{{ access_lease_file | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Persist current access lease
      ansible.builtin.copy:
        dest: "{{ access_lease_file }}"
        owner: root
        group: root
        mode: "0600"
        content: >-
          {{ {'revision': access_snapshot_revision,
              'valid_until': access_snapshot_valid_until} | to_nice_json }}

    - name: Install access lease watchdog executable
      ansible.builtin.template:
        src: access-lease-watchdog.py.j2
        dest: "{{ access_lease_watchdog_bin }}"
        owner: root
        group: root
        mode: "0755"

    - name: Install access lease watchdog service
      ansible.builtin.template:
        src: access-lease-watchdog.service.j2
        dest: /etc/systemd/system/casper-access-lease-watchdog.service
        owner: root
        group: root
        mode: "0644"

    - name: Install access lease watchdog timer
      ansible.builtin.template:
        src: access-lease-watchdog.timer.j2
        dest: /etc/systemd/system/casper-access-lease-watchdog.timer
        owner: root
        group: root
        mode: "0644"

    - name: Reload systemd for access lease units
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Validate access lease immediately
      ansible.builtin.command: "{{ access_lease_watchdog_bin }}"
      changed_when: false

    - name: Enable access lease watchdog timer
      ansible.builtin.systemd:
        name: casper-access-lease-watchdog.timer
        enabled: true
        state: started

    - name: Ensure sing-box is running after a valid access sync
      ansible.builtin.systemd:
        name: sing-box
        state: started
