---
# Transport matrix. Every value is overridable; NOTHING mimicry-related is
# hardcoded here (server_names/handshake/sni are empty and MUST be supplied).
# A node runs SEVERAL transports at once (diversity over monoculture).

singbox_config_dir: "/etc/sing-box"
singbox_bin: "/usr/local/bin/sing-box"

# REALITY keypair lifecycle (see roles/transports/tasks/keygen.yml).
# The pair (private+public) is persisted TOGETHER in the state file 0600 so a
# reprovision restores the exact public half — sing-box mints them as a pair and
# the role does not derive one from the other. Only the public half + short-id
# pool are published to reality_pub_artifact for control-plane to consume.
reality_key_state_file: "/etc/caspervpn/reality.key"
reality_pub_artifact: "/etc/caspervpn/reality.pub"
# Explicit-secret path: supply BOTH halves (from a secret manager) or NEITHER.
# A private key without its public is rejected — the role cannot safely derive it.
reality_explicit_private_key: ""
reality_explicit_public_key: ""

# Hysteria2 credential lifecycle (see tasks/hy2_keygen.yml). The password is
# generated once and persisted 0600; a plain converge / REALITY rotation reuse it.
hysteria2_cred_state_file: "/etc/caspervpn/hysteria2.cred"
# TLS model: production REQUIRES an operator-provided trusted cert+key (paths in
# transports.hysteria2.tls_cert_path/tls_key_path). A self-signed cert + client
# insecure:true is allowed ONLY under this explicit e2e flag — never a silent
# production fallback.
hysteria2_insecure_e2e: false

# per-user VLESS users (uuid + optional personal short_id) — filled by control-plane.
reality_users: []

# optional entry->exit chaining. When set on an entry, decrypted client traffic
# is forwarded to the exit endpoint (server IP comes from provisioning, not code).
exit_endpoint: {}

transports:
  vless_reality:
    enabled: true
    tag: "vless-reality-in"
    port: 443
    flow: "xtls-rprx-vision"
    server_names: []          # mimicry SNI(s) — REQUIRED, from docs/mimicry-domains.md
    handshake_server: ""      # real upstream host stolen for the handshake — REQUIRED
    handshake_port: 443
    private_key: ""           # server REALITY x25519 private key — REQUIRED (secret)
    short_ids: []             # short-id pool; per-user id appended by control-plane

  amneziawg:
    enabled: false
    tag: "awg-in"
    port: 51820
    private_key: ""
    mtu: 1420
    # obfuscation knobs that defeat WG entropy/signature detection (from AmneziaWGParams)
    jc: 4
    jmin: 40
    jmax: 70
    s1: 0
    s2: 0
    h1: 1
    h2: 2
    h3: 3
    h4: 4
    peers: []                 # [{public_key, allowed_ips: [...], preshared_key?}]

  hysteria2:
    enabled: false
    tag: "hysteria2-in"
    port: 8443
    password: ""
    obfs_type: "salamander"
    obfs_password: ""
    masquerade_url: ""        # real site to masquerade unauthenticated probes to
    tls_sni: ""              # CN for the node's self-signed QUIC cert (mimicry)
    tls_cert_path: "/etc/sing-box/hysteria2.crt"
    tls_key_path: "/etc/sing-box/hysteria2.key"

  shadowsocks_2022:
    enabled: false
    tag: "ss2022-in"
    port: 8388
    method: "2022-blake3-aes-256-gcm"
    psk: ""
