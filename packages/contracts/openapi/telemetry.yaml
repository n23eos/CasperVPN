openapi: 3.1.0
info:
  title: CasperVPN Telemetry Ingest API
  version: 0.1.0
  description: >
    Ingest for the "where did it get blocked" feedback loop. Accepts anonymous
    FieldSignals from clients and authoritative HealthEvents from orchestrator
    probes. FROZEN INTERFACE — signatures only. Owned by the telemetry team.
    PRIVACY: FieldSignal batches MUST carry no user identity.
servers:
  - url: http://telemetry:8085
    description: dev (docker-compose)
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: health
      responses:
        "200": { description: OK }

  /v1/signals:
    post:
      summary: Ingest a batch of anonymous field signals
      operationId: ingestSignals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signals]
              properties:
                signals:
                  type: array
                  maxItems: 1000
                  items: { $ref: "../schema/contracts.schema.json#/$defs/FieldSignal" }
      responses:
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer }
                  rejected: { type: integer }
        "400": { description: Malformed batch }
        "413": { description: Batch too large }
        "429": { description: Rate limited }

  /v1/health:
    post:
      summary: Ingest orchestrator probe health events
      operationId: ingestHealth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  maxItems: 1000
                  items: { $ref: "../schema/contracts.schema.json#/$defs/HealthEvent" }
      security:
        - internalToken: []
      responses:
        "202": { description: Accepted }
        "400": { description: Malformed batch }
        "401": { description: Unauthorized (probe auth required) }
components:
  securitySchemes:
    internalToken:
      type: http
      scheme: bearer
