schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Исходный проект: Go workspace, contracts/platform и шесть HTTP-сервисов,
  PostgreSQL 16, sing-box, Terraform/Ansible, внешние VPN-клиенты.
  Базовый commit: 4eba62f. Код сохраняется, новые изменения ведутся через OpenSpec.
  Пользователь разрешил автономную реализацию подготовки к запуску 2026-09-25.
  Контракты расширяются аддитивно с Go, JSON Schema и OpenAPI одновременно.
  Не использовать символы U+2013/U+2014. Не читать и не публиковать !notes.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
