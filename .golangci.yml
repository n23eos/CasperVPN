# golangci-lint (v2 config format) for the CasperVPN monorepo.
# Conservative, skeleton-friendly set; tighten per service as logic lands.
# Enforced in CI (go-ci.yml, job "lint") via `make lint LINT_STRICT=1`.
version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
        path: cmd/.*/main\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/caspervpn
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
